name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.13"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build-lock.txt

      - name: Run unit suite
        run: python -B -m unittest discover -s tests -v

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --distpath dist-ci --workpath build-ci "packaging/AI Virtual Display Manager.spec"

      - name: Build operator CLI
        run: python -m PyInstaller --noconfirm --clean --distpath dist-ci --workpath build-cli-ci "packaging/vdmctl.spec"
